[package]
name = "pydantic_sifr_core"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
description = "Native execution core for pydantic-sifr"
repository = "https://github.com/sifr-lang/pydantic-sifr"

[dependencies]
hex = "=0.4.3"
jiter = { version = "=0.16.0", default-features = false, features = ["num-bigint"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[dev-dependencies]
criterion = "=0.7.0"
proptest = "=1.8.0"

[[bench]]
name = "foundations"
harness = false

[lints]
workspace = true
