[package]
name = "pydantic_sifr_core"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
description = "Native execution core for pydantic-sifr"
repository = "https://github.com/sifr-lang/pydantic-sifr"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
bigdecimal = { version = "=0.4.10", default-features = false, features = ["std"] }
jiter = { version = "=0.16.0", default-features = false, features = ["num-bigint"] }
num-bigint = { version = "=0.4.8", default-features = false, features = ["std"] }
num-complex = { version = "=0.4.6", default-features = false, features = ["std"] }
num-rational = { version = "=0.4.2", default-features = false, features = ["num-bigint-std"] }
num-traits = { version = "=0.2.19", default-features = false, features = ["std"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sifr_runtime = { git = "https://github.com/sifr-lang/sifr.git", tag = "0.1.0-beta.16", default-features = false, features = ["structural"] }
speedate = "=0.17.0"
url = { version = "=2.5.8", default-features = false, features = ["std"] }
uuid = { version = "=1.24.0", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "=0.7.0"
hex = "=0.4.3"
proptest = "=1.8.0"

[[bench]]
name = "foundations"
harness = false

[lints]
workspace = true
