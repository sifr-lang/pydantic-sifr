[package]
name = "pydantic-sifr"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
description = "Native validation and serialization for Sifr"
repository = "https://github.com/sifr-lang/pydantic-sifr"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "sifr.toml",
  "src/**/*.sifr",
  "src/lib.rs",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_LICENSES.md",
]

[package.metadata.sifr]
manifest = "sifr.toml"

[dependencies]
pydantic_sifr_core = { path = "backend/pydantic_sifr_core" }
sifr_runtime = { git = "https://github.com/sifr-lang/sifr.git", rev = "89684aecbd2a321c92912a8cee051b9d9a4fc46a", default-features = false, features = ["structural"] }

[workspace]
resolver = "2"
members = ["backend/pydantic_sifr_core"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
