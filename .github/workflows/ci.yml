name: ci

env:
  SIFR_REV: 0e16cc73b2d1ba20a59db7f168193eb01a618ab5

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pydantic/pydantic
          ref: f59e929c999e8b2efc7b12fd0bc1685c1a186be3
          path: .upstream/pydantic
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sifr-lang/sifr
          ref: ${{ env.SIFR_REV }}
          path: .sifr-compiler
      - name: Check out the required Ruff source
        run: git -C .sifr-compiler submodule update --init third_party/ruff
      - name: Build the required Sifr compiler
        run: |
          cargo build --release -j 6 -p sifr --manifest-path .sifr-compiler/Cargo.toml
          echo "SIFR_BIN=$PWD/.sifr-compiler/target/release/sifr" >> "$GITHUB_ENV"
          echo "SIFR_SYSROOT=$PWD/.sifr-compiler" >> "$GITHUB_ENV"
      - run: scripts/run_all_tests.sh --profile create-pr
