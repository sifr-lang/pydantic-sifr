name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pydantic/pydantic
          ref: f59e929c999e8b2efc7b12fd0bc1685c1a186be3
          path: .upstream/pydantic
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Install the required Sifr release
        run: |
          archive=sifr-0.1.0-beta.16-x86_64-unknown-linux-gnu.tar.gz
          base=https://github.com/sifr-lang/sifr/releases/download/0.1.0-beta.16
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.sha256"
          sha256sum --check "$archive.sha256"
          mkdir -p /tmp/sifr-0.1.0-beta.16
          tar -xzf "$archive" -C /tmp/sifr-0.1.0-beta.16
          echo "/tmp/sifr-0.1.0-beta.16/bin" >> "$GITHUB_PATH"
      - run: scripts/run_all_tests.sh --profile create-pr
